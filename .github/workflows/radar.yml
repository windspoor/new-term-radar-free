name: Free new-term radar

on:
  schedule:
    - cron: "17 */2 * * *" # Public sources every 2 hours, away from the top of the hour.
    - cron: "17 1 * * *"   # Daily at 09:17 Asia/Shanghai (UTC+8).
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "scripts/cloud_free.py"
      - "config.public.json"
      - ".github/workflows/radar.yml"
  workflow_dispatch:
    inputs:
      command:
        description: "Collect public sources or create a daily report"
        type: choice
        options: [daily, collect]
        default: daily

concurrency:
  group: free-radar-public-history
  cancel-in-progress: false

permissions:
  contents: write # This repository only: generated public data on radar-data.

jobs:
  radar:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      COMMAND: ${{ github.event.inputs.command || (github.event_name == 'push' && 'daily') || (github.event.schedule == '17 1 * * *' && 'daily') || 'collect' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard library only; no paid keys, private site credentials, caches or artifacts.
      - name: Collect and publish public report
        run: python scripts/cloud_free.py "$COMMAND"
